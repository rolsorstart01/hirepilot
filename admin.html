<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Admin Panel | HirePilot</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div id="admin-login">
        <input type="password" id="admin-pass" placeholder="Secret Key">
        <button onclick="accessAdmin()">Access</button>
    </div>

    <div id="admin-dashboard" style="display:none;">
        <h1>HirePilot Admin</h1>
        <div class="admin-stats">
            <div>Revenue: <span id="total-revenue">₹0</span></div>
            <div>Total Users: <span id="user-count">0</span></div>
            <div>Apps Today: <span id="apps-today">0</span></div>
        </div>
        <div class="user-list">
            <h3>Manage Users</h3>
            <div id="users-data"></div>
        </div>
    </div>
    <script src="js/admin.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script src="js/config.js"></script>

    <script src="js/auth.js"></script>
</body>

</html>
