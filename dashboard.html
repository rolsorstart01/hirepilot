<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Dashboard | HirePilot</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="dashboard-body">
    <aside class="sidebar">
        <div class="logo">HirePilot</div>
        <nav>
            <a href="dashboard.html" class="active">Overview</a>
            <a href="filters.html">Job Filters</a>
            <a href="applications.html">Applications</a>
            <a href="pricing.html">Billing</a>
            <button id="logout-btn">Logout</button>
        </nav>
    </aside>

    <main class="content">
        <header class="content-header">
            <h1>Welcome back, <span id="user-name">Pilot</span></h1>
            <div class="status-badge">Automation: <span id="automation-status">Active</span></div>
        </header>

        <section class="stats-grid">
            <div class="stat-card">
                <h3>Total Applied</h3>
                <p id="total-applied">0</p>
            </div>
            <div class="stat-card">
                <h3>Resumes Created</h3>
                <p id="resumes-created">0</p>
            </div>
            <div class="stat-card">
                <h3>Pending Responses</h3>
                <p id="pending-responses">0</p>
            </div>
        </section>

        <section class="recent-activity">
            <h2>Recent Applications</h2>
            <table id="applications-table">
                <thead>
                    <tr>
                        <th>Job Title</th>
                        <th>Company</th>
                        <th>Status</th>
                        <th>Date</th>
                        <th>Resume</th>
                    </tr>
                </thead>
                <tbody id="app-list">
                </tbody>
            </table>
        </section>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="js/config.js"></script>
    <script src="js/dashboard.js"></script>
</body>

</html>
